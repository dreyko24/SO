name: vortex-escritorio-host
on:
  push:
    branches: [cambio-nombre-vortex-os]
  workflow_dispatch:
concurrency:
  group: vortex-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del simulador
        run: sudo apt-get update && sudo apt-get install -y gcc python3 python3-pil
      - name: Teclado PS/2 y atajos de ventanas (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/kbdtest.c -o /tmp/vortex-kbd-test
          /tmp/vortex-kbd-test
      - name: Decodificador IntelliMouse PS/2 (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/ps2_mouse_test.c -o /tmp/vortex-ps2-wheel-test
          /tmp/vortex-ps2-wheel-test
      - name: Seguridad de framebuffer, pitch y clipping
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/gfx_dimensions_test.c kernel/gfx.c -o /tmp/vortex-gfx-test
          /tmp/vortex-gfx-test
      - name: Pruebas de escritorio con AddressSanitizer
        run: OUTDIR=$PWD/host-capturas python3 tools/hostgui.py
      - name: Guardar capturas host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-hostgui
          path: host-capturas/*.png
          if-no-files-found: ignore
