name: vortex-escritorio-host
on:
  push:
    branches: [main, cambio-nombre-vortex-os, vortex/integracion-total-20261114, vortex/ventanas-dinamicas-20261114, vortex/redibujado-visible-20261114]
  workflow_dispatch:
  pull_request:
concurrency:
  group: vortex-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del simulador
        run: sudo apt-get update && sudo apt-get install -y gcc python3 python3-pil
      - name: Integridad de progreso de Vortex Saber (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/saber_progress_test.c -o /tmp/vortex-saber-progress-test
          /tmp/vortex-saber-progress-test
      - name: Conversion de fecha UTC a zona horaria Peru (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/clock_calendar_test.c -o /tmp/vortex-clock-test
          /tmp/vortex-clock-test
      - name: Teclado PS/2 y atajos de ventanas (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/kbdtest.c -o /tmp/vortex-kbd-test
          /tmp/vortex-kbd-test
      - name: Decodificador IntelliMouse PS/2 (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/ps2_mouse_test.c -o /tmp/vortex-ps2-wheel-test
          /tmp/vortex-ps2-wheel-test
      - name: Cuentas locales, derivación y persistencia (ASan/UBSan)
        run: |
          gcc -std=gnu11 -O2 -g -Wall -Wextra -Werror -Wno-misleading-indentation \
            -fsanitize=address,undefined -fno-pie -no-pie tests/session_test.c \
            kernel/session.c kernel/fs.c -o /tmp/vortex-session-test
          /tmp/vortex-session-test
      - name: Seguridad de framebuffer, pitch y clipping
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/gfx_dimensions_test.c kernel/gfx.c -o /tmp/vortex-gfx-test
          /tmp/vortex-gfx-test
      - name: Validar escalado de video e imagenes contra referencia pixel a pixel
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/gfx_scaler_test.c kernel/gfx.c -o /tmp/vortex-gfx-scaler-test
          /tmp/vortex-gfx-scaler-test
      - name: Pruebas de escritorio con AddressSanitizer
        run: OUTDIR=$PWD/host-capturas python3 tools/hostgui.py
      - name: Guardar capturas host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-hostgui
          path: host-capturas/*.png
          if-no-files-found: ignore
