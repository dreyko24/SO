name: vortex-usb-mass-storage
on:
  push:
    branches: [main, cambio-nombre-vortex-os, vortex/integracion-total-20261114]
  workflow_dispatch:
concurrency:
  group: vortex-usb-${{ github.ref }}
  cancel-in-progress: true
jobs:
  usb:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils python3 grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools cpio
      - name: Validar FAT32 corrupto en host (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/fat32_layout_test.c -o /tmp/vortex-fat32-test
          /tmp/vortex-fat32-test
      - name: Validar exFAT corrupto en host (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/exfat_layout_test.c -o /tmp/vortex-exfat-test
          /tmp/vortex-exfat-test
      - name: Validar informes HID de arranque (ASan/UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/usb_hid_test.c kernel/usb_hid.c -o /tmp/vortex-usb-hid-test
          /tmp/vortex-usb-hid-test
      - name: Compilar kernels
        run: |
          make -C kernel64
          make -C kernel
          python3 tools/mkrootfs.py --debian vortex-extra.cpio
      - name: Pendrive FAT32 de prueba
        run: |
          dd if=/dev/zero of=pendrive.img bs=1M count=128 status=none
          mkfs.vfat -F 32 -n VORTEXUSB pendrive.img
          mcopy -i pendrive.img docs/vortex-logo.png ::/VORTEX.PNG
          truncate -s 40K usb-ring.bin
          mcopy -i pendrive.img usb-ring.bin ::/ZZRING.BIN
          mdir -i pendrive.img ::
      - name: Arranque USB UHCI real emulado y exploracion FAT32
        run: |
          mkdir -p g/boot/grub
          cp kernel64/vortex-kernel64.elf vortex-extra.cpio g/boot/
          printf 'set timeout=0\ninsmod all_video\nmenuentry "Vortex OS" {\n  set gfxpayload=1024x768x32\n  multiboot /boot/vortex-kernel64.elf\n  module /boot/vortex-extra.cpio\n  boot\n}\n' > g/boot/grub/grub.cfg
          grub-mkrescue -o usb-boot.iso g >/tmp/grub.log 2>&1 || { cat /tmp/grub.log; exit 1; }
          python3 tools/ci_gui.py tools/ci/gui-usb-fisico.txt -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom usb-boot.iso -boot d -m 2G -vga std -display none -serial stdio -usb -drive if=none,id=stick,format=raw,file=pendrive.img -device usb-storage,bus=usb-bus.0,drive=stick > usb-gui.log 2>&1
          tail -100 usb-gui.log
          grep -Fq "USB FAT32 real leido" usb-gui.log || { echo "FALLO: no detecto ni leyo la memoria USB"; exit 1; }
          grep -Fq "archivo VORTEX.PNG (1965 bytes) importado" usb-gui.log || { echo "FALLO: FAT32 no se leyo realmente"; exit 1; }
          grep -Fq "[vortex-image] decoded" usb-gui.log || { echo "FALLO: no se pudo abrir la foto del USB"; exit 1; }
          grep -Fq "[vortex-usb] imagen importada desde dispositivo real" usb-gui.log || { echo "FALLO: la imagen no se copio de USB a /Imagenes"; exit 1; }
          grep -Fq "[vortex-wallpaper] updated" usb-gui.log || { echo "FALLO: no se aplico la foto de USB como fondo"; exit 1; }
          test -s capturas/04-archivos-usb.png
          test -s capturas/06-fondo-desde-usb.png
      - name: Pendrive FAT32 conectado tras un hub USB 1.1
        run: |
          # Simular el escenario donde el puerto raiz ve un HUB y la memoria
          # esta conectada detras. Evita depender solo de pendrives directos.
          python3 tools/ci_gui.py tools/ci/gui-usb-fisico.txt -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom usb-boot.iso -boot d -m 2G -vga std -display none -serial stdio -usb -drive if=none,id=stick,format=raw,file=pendrive.img -device usb-hub,bus=usb-bus.0,port=1 -device usb-storage,bus=usb-bus.0,port=1.1,drive=stick > hub-gui.log 2>&1
          tail -110 hub-gui.log
          grep -Fq "[vortex-usb] hub 1.1" hub-gui.log || { echo "FALLO: no encontro el hub intermedio"; exit 1; }
          grep -Fq "USB FAT32 real leido" hub-gui.log || { echo "FALLO: no leyo la memoria detras del hub"; exit 1; }
      - name: Hotplug UHCI con un teclado conectado antes del pendrive
        run: |
          set -o pipefail
          python3 tools/ci_usb_topology.py usb-boot.iso pendrive.img | tee usb-topology.log
      - name: Pendrive exFAT de prueba (metadatos, carpetas y contenido real)
        run: |
          python3 tools/ci_exfat_image.py pendrive-exfat.img docs/vortex-logo.png
      - name: Importar FAT32 y exFAT por xHCI con reconexion en ambos kernels
        run: |
          set -o pipefail
          mkdir -p gx/boot/grub
          cp kernel/vortex-kernel.elf gx/boot/
          sed '/^  module /d; s/vortex-kernel64/vortex-kernel/' g/boot/grub/grub.cfg > gx/boot/grub/grub.cfg
          grub-mkrescue -o usb-boot32.iso gx
          for bits in 64 32; do
            iso=usb-boot.iso
            if [ "$bits" = 32 ]; then iso=usb-boot32.iso; fi
            python3 tools/ci_usb_xhci.py "$iso" pendrive.img | tee "usb-xhci-fat32-${bits}.log"
            python3 tools/ci_usb_xhci.py "$iso" pendrive-exfat.img exFAT | tee "usb-xhci-exfat-${bits}.log"
          done
      - name: Controlar el escritorio por USB sin PS/2 en 32 y 64 bits
        run: |
          set -o pipefail
          python3 tools/ci_usb_hid.py usb-boot.iso --disk-image pendrive.img | tee usb-hid64.log
          python3 tools/ci_usb_hid.py usb-boot32.iso | tee usb-hid32.log
      - name: Abrir un PNG desde la memoria USB 3 en el escritorio
        run: |
          python3 tools/ci_gui.py tools/ci/gui-usb-fisico.txt -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom usb-boot.iso -boot d -m 2G -vga std -display none -serial stdio -device qemu-xhci,id=xhci -drive if=none,id=stick,format=raw,file=pendrive.img,readonly=on -device usb-storage,bus=xhci.0,drive=stick > usb-xhci-gui.log 2>&1
          tail -80 usb-xhci-gui.log
          grep -Fq 'entradas, raiz=2 por xHCI' usb-xhci-gui.log
          grep -Fq '[vortex-image] decoded' usb-xhci-gui.log
          grep -Fq '[vortex-wallpaper] updated' usb-xhci-gui.log
          cp capturas/04-archivos-usb.png capturas/xhci-archivos.png
          cp capturas/06-fondo-desde-usb.png capturas/xhci-fondo.png
      - name: Arranque USB UHCI y lectura exFAT de archivo real
        run: |
          python3 tools/ci_gui.py tools/ci/gui-usb-fisico.txt -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom usb-boot.iso -boot d -m 2G -vga std -display none -serial stdio -usb -drive if=none,id=stick,format=raw,file=pendrive-exfat.img -device usb-storage,bus=usb-bus.0,drive=stick > exfat-gui.log 2>&1
          tail -75 exfat-gui.log
          grep -Fq "USB exFAT real leido" exfat-gui.log || { echo "FALLO: no monto exFAT"; exit 1; }
          grep -Fq "archivo VORTEX.PNG (1965 bytes) importado exFAT" exfat-gui.log || { echo "FALLO: no importo PNG exFAT"; exit 1; }
          grep -Fq "[vortex-image] decoded" exfat-gui.log || { echo "FALLO: no abrio PNG exFAT"; exit 1; }
          grep -Fq "[vortex-wallpaper] updated" exfat-gui.log || { echo "FALLO: no aplico fondo exFAT"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-usb
          path: |
            usb-gui.log
            hub-gui.log
            exfat-gui.log
            usb-topology.log
            usb-xhci-*.log
            usb-hid*.log
            capturas/*.png
