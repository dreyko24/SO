name: vortex-iso-unica
# Medio oficial de evaluación: arranque gráfico x86_64 con Firefox ESR y LibreOffice.
on:
  push:
    branches: [main, cambio-nombre-vortex-os, vortex/integracion-total-20261114]
    paths:
      - '.github/workflows/vm-iso.yml'
      - 'kernel/gui.c'
      - 'kernel/gui_session.inc'
      - 'kernel/session.c'
      - 'kernel/session.h'
      - 'kernel/session_console.inc'
      # Los cambios en el nucleo propio de 64 bits también deben generar
      # la ISO única; antes Makefile/proc64.c quedaban fuera del filtro.
      - 'kernel64/Makefile'
      - 'kernel64/user/**'
      - 'tools/mkrootfs.py'
      - 'tools/ci_drive.py'
      - 'tools/ci_firefox_desktop.py'
      - 'tools/ci_session.py'
      - 'tools/ci_usb_hid.py'
      - 'tools/ci_usb_topology.py'
      - 'tools/ci/firefox/**'
      - 'tools/ci/firefox-funciones.sh'
      - 'tools/ci/firefox-funciones.txt'
      - 'tools/ci/firefox-descarga.py'
      - 'tools/ci/firefox-descarga.txt'
      - 'tools/ci/oficina-preinstalada.txt'
      - 'tools/xwd2png.py'
      - 'tests/test_xwd2png.py'
      - 'kernel64/kernel64.c'
      - 'kernel64/proc64.c'
      - 'kernel64/sys_*.inc'
      - 'kernel64/*.S'
      - 'kernel64/sock.c'
      - 'kernel/encyclopedia.h'
      - 'kernel/saber_progress.h'
      - 'kernel/ps2_mouse.h'
      - 'kernel/input_events.h'
      - 'kernel/kbd.c'
      - 'kernel/disk.c'
      - 'kernel/fs.c'
      - 'kernel/ui_locale.h'
      - 'kernel/media_demo.c'
      - 'kernel/usb_storage.c'
      - 'kernel/usb.c'
      - 'kernel/usb.h'
      - 'kernel/usb_xhci.c'
      - 'kernel/usb_xhci.h'
      - 'kernel/usb_hid.c'
      - 'kernel/usb_hid.h'
      - 'kernel/exfat_layout.h'
      - 'kernel/audio.c'
      - 'kernel/audio_sb16.c'
      - 'kernel/video.c'
      - 'kernel/gfx.c'
      - 'tools/build-iso.sh'
      - 'tools/mkdebian.sh'
      - 'tools/rootfs-es/**'
      - 'kernel/html.c'
      - 'kernel/html.h'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: vortex-iso-unica-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    # Debe empaquetar glibc de ISA x86-64 base, no x86-64-v3 del runner 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Preparar compilador, Debian y virtualizacion
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools python3 cpio gzip qemu-system-x86 debootstrap debian-archive-keyring ca-certificates dosfstools fdisk
      - name: Identificar revision incluida en la ISO
        run: echo "Construyendo Vortex OS desde commit $GITHUB_SHA"
      - name: Construir VortexOS.iso (x86_64 gráfico con Firefox ESR y LibreOffice)
        shell: bash
        run: |
          set -euo pipefail
          VORTEX_DEBIAN=1 bash tools/build-iso.sh
      - name: Verificar el contenido de VortexOS.iso
        shell: bash
        run: |
          set -euo pipefail
          test -s out/VortexOS.iso
          ( cd out && sha256sum -c VortexOS.iso.sha256 )
          iso_kernels=$(xorriso -indev out/VortexOS.iso -find / -type f -name '*.elf' -exec echo --)
          printf '%s\n' "$iso_kernels"
          test "$iso_kernels" = "'/boot/vortex-kernel64.elf'"
          iso_boot=$(xorriso -indev out/VortexOS.iso -ls /boot -- | LC_ALL=C sort)
          printf '%s\n' "$iso_boot"
          test "$iso_boot" = "$(printf '%s\n' "'debian.cpio.gz'" "'grub'" "'vortex-extra.cpio'" "'vortex-kernel64.elf'")"
          boot_catalog=$(xorriso -indev out/VortexOS.iso -report_el_torito plain)
          printf '%s\n' "$boot_catalog"
          grep -Eq '^El Torito boot img[[:space:]]*:[[:space:]]+[0-9]+[[:space:]]+BIOS[[:space:]]+y[[:space:]]' <<<"$boot_catalog"
          grep -Eq '^El Torito boot img[[:space:]]*:[[:space:]]+[0-9]+[[:space:]]+UEFI[[:space:]]+y[[:space:]]' <<<"$boot_catalog"
          grub_cfg=$(mktemp)
          trap 'rm -f "$grub_cfg"' EXIT
          xorriso -osirrox on -indev out/VortexOS.iso -extract /boot/grub/grub.cfg "$grub_cfg"
          cat "$grub_cfg"
          grub-script-check "$grub_cfg"
          test "$(grep -E '^[[:space:]]*(menuentry|submenu)[[:space:]]' "$grub_cfg")" = 'menuentry "Vortex OS - 64 bits (grafico)" {'
          grep -Eq '(^|[[:space:]])multiboot[[:space:]]+/boot/vortex-kernel64\.elf([[:space:]]|$)' "$grub_cfg"
      - name: Verificar ISO real 64 bits en QEMU
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 110s qemu-system-x86_64             -m 4096 -cdrom out/VortexOS.iso -boot order=d -display none             -vga std -serial file:vortex-64.log -monitor none -no-reboot             -netdev user,id=n0 -device e1000,netdev=n0
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU 64 falló: $rc"; exit 1; fi
          grep -aFq 'Iniciando escritorio' vortex-64.log || {
            tail -80 vortex-64.log; echo 'FALLO: no arranco modo grafico de 64 bits'; exit 1;
          }
          grep -aFq '[vortex-session] primera cuenta' vortex-64.log
          if grep -aFq '[PANIC]' vortex-64.log; then
            tail -100 vortex-64.log; echo 'FALLO: el nucleo 64 bits tuvo una excepcion'; exit 1;
          fi
          echo 'Vortex 64 bits grafico: OK'
      - name: Verificar el aviso de memoria insuficiente con 256 MiB en QEMU
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          timeout --signal=TERM --kill-after=5s 45s qemu-system-x86_64 \
            -m 256M -cdrom out/VortexOS.iso -boot order=d -display none \
            -vga std -serial file:vortex-256m.log -monitor none -no-reboot || rc=$?
          cat vortex-256m.log
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU con 256 MiB falló: $rc"; exit 1; fi
          grep -aFq 'No se pudo cargar el entorno de Firefox.' vortex-256m.log &&
            grep -aFq 'Asigna 4 GB de RAM a la VM y comprueba VortexOS.iso.' vortex-256m.log || {
            echo 'FALLO: falta el aviso de GRUB sobre Firefox y la memoria de la VM'; exit 1;
          }
          if grep -aEq '== vortex-kernel |\[PANIC\]' vortex-256m.log; then
            echo 'FALLO: se inició el kernel sin el entorno requerido'; exit 1
          fi
      - name: Comprobar lanzadores del kit de pruebas
        run: |
          bash -n tools/probar-vortex.sh
          test -s Probar-VortexOS.cmd
          test -s README.md
      - name: Guardar la ISO unica, lanzadores y registros
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO-unica
          path: |
            out/VortexOS.iso
            out/VortexOS.iso.sha256
            vortex-64.log
            vortex-256m.log
            Probar-VortexOS.cmd
            tools/probar-vortex.sh
            README.md
          if-no-files-found: error
          retention-days: 30
      - name: Comprobar que Firefox ESR, Xvfb y LibreOffice vienen dentro de Debian
        shell: bash
        run: |
          set -euo pipefail
          test -s build/iso/boot/debian.cpio.gz
          gzip -dc build/iso/boot/debian.cpio.gz | cpio -t 2>/dev/null > /tmp/vortex-debian-files.txt
          grep -Eq '^\.?/?usr/bin/firefox-esr$' /tmp/vortex-debian-files.txt
          grep -Eq '^\.?/?usr/bin/Xvfb$' /tmp/vortex-debian-files.txt
          for app in libreoffice lowriter localc loimpress lodraw lomath; do
            grep -Eq "^\\.?/?usr/bin/${app}$" /tmp/vortex-debian-files.txt
          done
          echo "Firefox ESR, Xvfb y LibreOffice preinstalados: OK"
      - name: Abrir Firefox desde Actividades y navegar en la ISO de 64 bits
        run: |
          set -o pipefail
          python3 tools/ci_firefox_desktop.py out/VortexOS.iso firefox-escritorio.ppm | tee firefox-escritorio.log
      - name: Diagnosticar servidor X y navegador reales dentro del kernel de 64 bits
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_xwd2png.py
          # QEMU -initrd NO descomprime los modulos .gz. En la ISO real los
          # entrega GRUB; para -kernel hay que extraerlos antes.
          gzip -dc build/iso/boot/debian.cpio.gz > /tmp/vortex-ci-debian.cpio
          test -s /tmp/vortex-ci-debian.cpio
          # Receptor de evidencias XWD: captura real del servidor X invitado.
          mkdir -p subidas
          python3 tools/ci_upload.py 18091 > vortex-web-upload.log 2>&1 &
          upload_pid=$!
          python3 -m http.server 18092 --bind 127.0.0.1 --directory tools/ci/firefox > vortex-web-http.log 2>&1 &
          page_pid=$!
          trap 'kill "$upload_pid" "$page_pid" 2>/dev/null || true' EXIT
          sleep 1
          cat >/tmp/vortex-web-commands.txt <<'CMDS'
          60|pantalla
          45|run sh -c 'for i in $(seq 20);do xdpyinfo -display :0 >/dev/null 2>&1 && echo X11_ANTES && exit;sleep 1;done;exit 1'
          # Terminar el Xvfb de esta VM desde el PID que el servidor registró.
          25|ejecutar /bin/sh -c 'kill -KILL $(cat /tmp/.X0-lock) && echo VORTEX_XVFB_DETENIDO'
          @esperar 3
          45|abrir xdpyinfo
          65|run sh -c 'for i in $(seq 40);do grep -qs "^name of display:" /tmp/vortex-web.log && echo X11_OK && exit;sleep 1;done;exit 1'
          20|pantalla
          # xterm requiere PTY; documentar el error sin confundirlo con Xvfb
          30|abrir xterm
          @esperar 3
          20|ejecutar /bin/cat /tmp/vortex-web.log
          20|rastro 1
          30|abrir firefox-esr http://10.0.2.2:18092/
          @esperar 4
          20|ejecutar /bin/cat /tmp/vortex-web.log
          20|rastro 0
          20|procesos
          # Dar tiempo al arranque de contenido y su composicion en QEMU TCG.
          @esperar 50
          20|procesos
          @esperar 70
          20|procesos
          # Evidencia de GUI real: ventanas registradas en X11 y framebuffer
          # XWD nativo, obtenido del Xvfb que se ejecuta en Vortex.
          40|ejecutar /usr/bin/xwininfo -root -tree
          50|ejecutar /bin/sh -c "gzip -1 -c /var/lib/xvfb/Xvfb_screen0 > /tmp/vortex-firefox.xwd.gz"
          75|ejecutar /usr/bin/curl -fsS -m 65 -T /tmp/vortex-firefox.xwd.gz http://10.0.2.2:18091/vortex-firefox.xwd.gz
          CMDS
          set +e
          VORTEX_PROMPT='vortex> ' KELF=kernel64/vortex-kernel64-text.elf \
            timeout --signal=TERM --kill-after=5s 480s python3 tools/ci_drive.py \
              /tmp/vortex-web-commands.txt vortex-web-smoke.log -- \
              qemu-system-x86_64 -m 4096 -kernel kernel64/vortex-kernel64-text.elf \
              -initrd /tmp/vortex-ci-debian.cpio,build/iso/boot/vortex-extra.cpio \
              -display none -serial stdio -monitor none -no-reboot \
              -netdev user,id=n0 -device e1000,netdev=n0
          code=$?
          set -e
          tail -200 vortex-web-smoke.log
          if [[ "$code" != 0 && "$code" != 124 ]]; then echo "FALLO QEMU web: $code"; exit 1; fi
          grep -aq '^X11_ANTES[[:space:]]*$' vortex-web-smoke.log || {
             echo 'FALLO: xdpyinfo no verificó el arranque inicial de Xvfb'; exit 1;
          }
          grep -aq '^VORTEX_XVFB_DETENIDO[[:space:]]*$' vortex-web-smoke.log || {
             echo 'FALLO: la prueba no pudo detener Xvfb'; exit 1;
          }
          grep -aq '^X11_OK[[:space:]]*$' vortex-web-smoke.log || {
             echo 'FALLO: xdpyinfo no verificó la recuperación de Xvfb'; exit 1;
          }
          test "$(grep -ac 'pantalla: iniciando el servidor X' vortex-web-smoke.log)" -eq 2 || {
             echo 'FALLO: se esperaban dos inicios de Xvfb'; exit 1;
          }
          test "$(grep -ac 'vortex-xinput: listo' vortex-web-smoke.log)" -eq 2 || {
             echo 'FALLO: el puente XTEST debe conectarse una vez a cada servidor'; exit 1;
          }
          echo 'X11: servidor y puente de entrada recuperados en QEMU'
          # Regresiones ya demostradas: Firefox debe superar carga XPCOM
          # y ARCH_SET_GS. La presencia del proceso no prueba navegacion.
          if grep -Eq "Couldn't load XPCOM|wasm_rt_syscall_set_segue_base error" vortex-web-smoke.log; then
             echo 'FALLO: Firefox volvio a fallar en XPCOM o ARCH_SET_GS'; exit 1;
          fi
          # Convertir la memoria de video real en captura, si hubo transferencia.
          # Si falla, el artefacto conserva los registros sin declarar GUI OK.
          if test -s subidas/vortex-firefox.xwd.gz &&
             gzip -dc subidas/vortex-firefox.xwd.gz > /tmp/vortex-firefox.xwd &&
             python3 tools/xwd2png.py /tmp/vortex-firefox.xwd vortex-firefox.png --expect-rgb 26a69a &&
             grep -Eq '"GET / HTTP/1\.[01]" 200' vortex-web-http.log &&
             grep -Eq '0x[[:xdigit:]]+ "Vortex OS CI - prueba de renderizado[^"]*": \("Navigator" "firefox-esr"\)' vortex-web-smoke.log; then
            echo 'Firefox ESR: pagina HTTP local renderizada en QEMU'
          else
            echo 'AVISO: sin evidencia suficiente de contenido HTTP renderizado en Firefox'
          fi
          # Presencia real del padre y subprocesos (sin confundirlo con UI validada).
          grep -q '/usr/bin/firefox-esr' vortex-web-smoke.log || {
             echo 'FALLO: no se observo el ejecutable real de Firefox'; exit 1;
          }
          if grep -Eq ' (Web Content|Isolated Web Co)([[:space:]]|$)' vortex-web-smoke.log; then
             echo 'Firefox: proceso de contenido observado'
          else
             echo 'AVISO: sin proceso de contenido tras tres muestras'
          fi
          # xdpyinfo, xterm y Firefox muestran errores en el log, y
          # rastro 1 imprime las llamadas fallidas al puerto serie.
          # NO confundir Xvfb operativo con navegador web funcional.
      - name: Verificar navegación y video WebM en Firefox
        run: |
          bash tools/ci/firefox-funciones.sh kernel64/vortex-kernel64-text.elf \
            /tmp/vortex-ci-debian.cpio build/iso/boot/vortex-extra.cpio vortex-web-funciones
      - name: Verificar descarga binaria en Firefox
        run: |
          python3 tools/ci/firefox-descarga.py kernel64/vortex-kernel64-text.elf \
            /tmp/vortex-ci-debian.cpio build/iso/boot/vortex-extra.cpio vortex-web-descarga
      - name: Abrir, guardar y exportar un documento con Writer
        run: |
          python3 tools/ci_drive.py tools/ci/oficina-preinstalada.txt vortex-oficina.log -- \
            qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf \
            -initrd /tmp/vortex-ci-debian.cpio -m 4096 -display none -serial stdio -monitor none -nic none -no-reboot
          tr -d '\r' < vortex-oficina.log > vortex-oficina-salida.log
          grep -x 'VORTEX_OFICINA_OK' vortex-oficina-salida.log
      - name: Guardar diagnostico X11, Firefox y LibreOffice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-web-smoke
          path: |
            vortex-web-smoke.log
            vortex-web-upload.log
            vortex-web-http.log
            vortex-firefox.png
            vortex-web-funciones/*.log
            vortex-web-descarga/
            firefox-escritorio.log
            firefox-escritorio.ppm
            firefox-escritorio.entrada.ppm
            vortex-oficina.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar la ISO unica actualizada (no crear releases por cada version)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iso-latest"
          short="${GITHUB_SHA:0:7}"
          notes="ISO de Vortex OS del commit ${GITHUB_SHA}. Arranque gráfico x86_64 con cuentas locales, Firefox ESR y LibreOffice preinstalados. Asigna 4 GB de RAM a la VM. QEMU comprueba la navegación y descargas de Firefox, la reproducción WebM y la apertura, guardado y exportación de documentos en Writer. Quedan pendientes el aislamiento de Firefox y las pruebas en hardware físico y VMware."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Vortex OS - ISO actual" --notes "$notes"
          fi
          gh release upload "$tag" out/VortexOS.iso out/VortexOS.iso.sha256 --clobber
          gh release edit "$tag" --title "Vortex OS - ISO actual ($short)" --notes "$notes" --prerelease
