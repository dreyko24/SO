name: vortex-iso-maquina-virtual
# ISO de evaluacion en dos variantes; no modifica la rama principal.
on:
  push:
    branches: [cambio-nombre-vortex-os]
    paths: ['.github/workflows/vm-iso.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vortex-iso-vm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        edicion: [ligera, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas necesarias para generar y probar una ISO real
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools python3 cpio gzip qemu-system-x86 debootstrap debian-archive-keyring ca-certificates dosfstools fdisk
      - name: Construir Vortex OS con ambos kernels
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.edicion }}" == debian ]]; then
            VORTEX_DEBIAN=1 VORTEX_SIN_INSTALADOR=1 bash tools/build-iso.sh
            ISO="VortexOS-Debian-VM.iso"
          else
            VORTEX_SIN_INSTALADOR=1 bash tools/build-iso.sh
            ISO="VortexOS-VM.iso"
          fi
          mv out/VortexOS.iso "out/$ISO"
          rm out/VortexOS.iso.sha256
          ( cd out && sha256sum "$ISO" > "$ISO.sha256" )
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          ls -lh "out/$ISO"
          ( cd out && sha256sum -c "$ISO.sha256" )
      - name: Comprobar el arranque de la propia ISO en QEMU
        shell: bash
        run: |
          set -euo pipefail
          ram=2048
          if [[ "${{ matrix.edicion }}" == debian ]]; then ram=4096; fi
          set +e
          timeout --signal=TERM --kill-after=5s 90s qemu-system-x86_64 \
            -m "$ram" -cdrom "out/$ISO" -boot order=d -display none \
            -vga std -serial file:vortex-iso-boot.log -monitor none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then
            echo "QEMU termino de forma inesperada (codigo $rc)"
            tail -80 vortex-iso-boot.log || true
            exit 1
          fi
          tail -60 vortex-iso-boot.log || true
          grep -aFq "Iniciando escritorio" vortex-iso-boot.log || {
            echo "FALLO: el escritorio de Vortex OS no arranco desde la ISO"; exit 1;
          }
          echo "ISO verificada: arranque grafico correcto en QEMU"
      - name: Guardar ISO y prueba de arranque en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO-${{ matrix.edicion }}
          path: |
            out/*.iso
            out/*.sha256
            vortex-iso-boot.log
          if-no-files-found: error
          retention-days: 30
      - name: Publicar ISO descargable como version preliminar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="vortex-vm-${{ matrix.edicion }}-$short"
          if [[ "${{ matrix.edicion }}" == debian ]]; then
            notes="ISO preliminar de Vortex OS (kernel propio) con Debian 12, apt y entorno preparado para instalar LibreOffice. RAM recomendada: 4 GB. No incluye LibreOffice preinstalado. USB fisico verificado solo en UHCI/FAT32 emulado; MP4/MP3 sin decodificador nativo. Sin instalador en disco."
          else
            notes="ISO preliminar de Vortex OS (kernel propio) con escritorio, galeria, WAV AC97 y AVI RGB; SIN Debian ni LibreOffice instalado. RAM recomendada: 2 GB. Sin instalador en disco."
          fi
          gh release create "$tag" \
            "out/$ISO" "out/$ISO.sha256" \
            --target "$GITHUB_SHA" \
            --title "Vortex OS para maquina virtual - ${{ matrix.edicion }} ($short)" \
            --notes "$notes" --prerelease
