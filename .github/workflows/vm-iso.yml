name: vortex-iso-unica
# Unico medio de evaluacion: arranque grafico del kernel propio de 32 y 64 bits.
# Construccion de Vortex Flow: compositor por regiones, UI proporcional, acceso rapido y 32/64 grafico.
on:
  push:
    branches: [main, cambio-nombre-vortex-os, vortex/integracion-total-20261114]
    paths:
      - '.github/workflows/vm-iso.yml'
      - 'kernel/gui.c'
      - 'kernel/encyclopedia.h'
      - 'kernel/saber_progress.h'
      - 'kernel/ps2_mouse.h'
      - 'kernel/disk.c'
      - 'kernel/fs.c'
      - 'kernel/ui_locale.h'
      - 'kernel/media_demo.c'
      - 'kernel/usb_storage.c'
      - 'kernel/exfat_layout.h'
      - 'kernel/audio.c'
      - 'kernel/audio_sb16.c'
      - 'kernel/video.c'
      - 'kernel/gfx.c'
      - 'tools/build-iso.sh'
      - 'tools/mkdebian.sh'
      - 'tools/rootfs-es/**'
      - 'kernel/html.c'
      - 'kernel/html.h'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vortex-iso-unica-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Preparar compilador, Debian y virtualizacion
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools python3 cpio gzip qemu-system-x86 debootstrap debian-archive-keyring ca-certificates dosfstools fdisk
      # Se inicia al modificar este workflow para crear una ISO de la revision
      # actual. La ISO se publica solo tras arrancar ambos modos en QEMU.
      - name: Identificar revision incluida en la ISO
        run: echo "Construyendo Vortex OS desde commit $GITHUB_SHA"
      - name: Construir VortexOS.iso (32/64 grafico, Debian solo en 64)
        shell: bash
        run: |
          set -euo pipefail
          VORTEX_DEBIAN=1 bash tools/build-iso.sh
          test -s out/VortexOS.iso
          test "$(grep -c '^menuentry ' build/iso/boot/grub/grub.cfg)" -eq 2
          grep -Fq 'Vortex OS - 64 bits (grafico)' build/iso/boot/grub/grub.cfg
          grep -Fq 'Vortex OS - 32 bits (grafico)' build/iso/boot/grub/grub.cfg
          test -s build/iso/boot/vortex-kernel.elf
          test -s build/iso/boot/vortex-kernel64.elf
          ( cd out && sha256sum -c VortexOS.iso.sha256 )
          cat build/iso/boot/grub/grub.cfg
          ls -lh out/VortexOS.iso
      - name: Verificar ISO real 64 bits en QEMU
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 110s qemu-system-x86_64             -m 4096 -cdrom out/VortexOS.iso -boot order=d -display none             -vga std -serial file:vortex-64.log -monitor none -no-reboot             -netdev user,id=n0 -device e1000,netdev=n0
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU 64 falló: $rc"; exit 1; fi
          grep -aFq 'Iniciando escritorio' vortex-64.log || {
            tail -80 vortex-64.log; echo 'FALLO: no arranco modo grafico de 64 bits'; exit 1;
          }
          echo 'Vortex 64 bits grafico: OK'
      - name: Verificar segundo modo grafico de la misma imagen (32 bits)
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^set default=0$/set default=1/' build/iso/boot/grub/grub.cfg
          grub-mkrescue -o /tmp/vortex32-check.iso build/iso >/tmp/vortex-grub32.log 2>&1 || {
            cat /tmp/vortex-grub32.log; exit 1;
          }
          set +e
          timeout --signal=TERM --kill-after=5s 95s qemu-system-x86_64             -m 1024 -cdrom /tmp/vortex32-check.iso -boot order=d -display none             -vga std -serial file:vortex-32.log -monitor none -no-reboot
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU 32 fallo: $rc"; exit 1; fi
          grep -aFq 'Iniciando escritorio' vortex-32.log || {
            tail -80 vortex-32.log; echo 'FALLO: no arranco modo grafico de 32 bits'; exit 1;
          }
          echo 'Vortex 32 bits grafico: OK'
      - name: Comprobar lanzadores del kit de pruebas
        run: |
          bash -n tools/probar-vortex.sh
          test -s Probar-VortexOS.cmd
          test -s README.md
      - name: Guardar la ISO unica, lanzadores y registros
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO-unica
          path: |
            out/VortexOS.iso
            out/VortexOS.iso.sha256
            vortex-64.log
            vortex-32.log
            Probar-VortexOS.cmd
            tools/probar-vortex.sh
            README.md
          if-no-files-found: error
          retention-days: 30
      - name: Comprobar que Firefox ESR y Xvfb vienen dentro de Debian
        shell: bash
        run: |
          set -euo pipefail
          test -s build/iso/boot/debian.cpio.gz
          gzip -dc build/iso/boot/debian.cpio.gz | cpio -t 2>/dev/null > /tmp/vortex-debian-files.txt
          grep -Eq '^\.?/?usr/bin/firefox-esr$' /tmp/vortex-debian-files.txt
          grep -Eq '^\.?/?usr/bin/Xvfb$' /tmp/vortex-debian-files.txt
          echo "Firefox ESR y Xvfb preinstalados: OK"
      - name: Diagnosticar servidor X y navegador reales dentro del kernel de 64 bits
        shell: bash
        run: |
          set -euo pipefail
          # QEMU -initrd NO descomprime los modulos .gz. En la ISO real los
          # entrega GRUB; para -kernel hay que extraerlos antes.
          gzip -dc build/iso/boot/debian.cpio.gz > /tmp/vortex-ci-debian.cpio
          test -s /tmp/vortex-ci-debian.cpio
          cat >/tmp/vortex-web-commands.txt <<'CMDS'
          60|pantalla
          @esperar 12
          30|procesos
          60|abrir xterm
          @esperar 14
          30|procesos
          90|abrir firefox-esr https://example.com/
          @esperar 18
          30|procesos
          CMDS
          set +e
          VORTEX_PROMPT='vortex> ' KELF=kernel64/vortex-kernel64-text.elf \
            timeout --signal=TERM --kill-after=5s 480s python3 tools/ci_drive.py \
              /tmp/vortex-web-commands.txt vortex-web-smoke.log -- \
              qemu-system-x86_64 -m 4096 -kernel kernel64/vortex-kernel64-text.elf \
              -initrd /tmp/vortex-ci-debian.cpio,build/iso/boot/vortex-extra.cpio \
              -display none -serial stdio -monitor none -no-reboot \
              -netdev user,id=n0 -device e1000,netdev=n0
          code=$?
          set -e
          tail -200 vortex-web-smoke.log
          if [[ "$code" != 0 && "$code" != 124 ]]; then echo "FALLO QEMU web: $code"; exit 1; fi
          grep -q 'pantalla: iniciando el servidor X' vortex-web-smoke.log || {
             echo 'FALLO: Xvfb no se pudo ejecutar'; exit 1;
          }
          # Esto comprueba que se intenta arrancar Xvfb con Debian cargado.
          # Aun NO verifica que Firefox haya dibujado una pagina web.
      - name: Guardar diagnostico X11 y Firefox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-web-smoke
          path: vortex-web-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar la ISO unica actualizada (no crear releases por cada version)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="iso-latest"
          short="${GITHUB_SHA:0:7}"
          notes="ISO de Vortex OS del commit ${GITHUB_SHA}. Kernel propio grafico de 32 y 64 bits. Debian y Firefox ESR/Xvfb incorporados en el modo 64 bits. Los arranques 32/64 se prueban en QEMU; el navegador grafico y USB fisico VMware siguen pendientes de validacion. Sin instalador de disco."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Vortex OS - ISO actual" --notes "$notes"
          fi
          gh release upload "$tag" out/VortexOS.iso out/VortexOS.iso.sha256 --clobber
          gh release edit "$tag" --title "Vortex OS - ISO actual ($short)" --notes "$notes" --prerelease
