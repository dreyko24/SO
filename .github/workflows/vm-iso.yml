name: vortex-iso-unica
# Unico medio de evaluacion: arranque grafico del kernel propio de 32 y 64 bits.
# Construccion de Vortex Flow: compositor por regiones, UI proporcional, acceso rapido y 32/64 grafico.
on:
  push:
    branches: [cambio-nombre-vortex-os]
    paths:
      - '.github/workflows/vm-iso.yml'
      - 'kernel/gui.c'
      - 'kernel/ui_locale.h'
      - 'kernel/media_demo.c'
      - 'kernel/usb_storage.c'
      - 'kernel/exfat_layout.h'
      - 'kernel/audio.c'
      - 'kernel/audio_sb16.c'
      - 'kernel/video.c'
      - 'kernel/gfx.c'
      - 'tools/build-iso.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vortex-iso-unica-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Preparar compilador, Debian y virtualizacion
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools python3 cpio gzip qemu-system-x86 debootstrap debian-archive-keyring ca-certificates dosfstools fdisk
      # Se inicia al modificar este workflow para crear una ISO de la revision
      # actual. La ISO se publica solo tras arrancar ambos modos en QEMU.
      - name: Identificar revision incluida en la ISO
        run: echo "Construyendo Vortex OS desde commit $GITHUB_SHA"
      - name: Construir VortexOS.iso (32/64 grafico, Debian solo en 64)
        shell: bash
        run: |
          set -euo pipefail
          VORTEX_DEBIAN=1 bash tools/build-iso.sh
          test -s out/VortexOS.iso
          test "$(grep -c '^menuentry ' build/iso/boot/grub/grub.cfg)" -eq 2
          grep -Fq 'Vortex OS - 64 bits (grafico)' build/iso/boot/grub/grub.cfg
          grep -Fq 'Vortex OS - 32 bits (grafico)' build/iso/boot/grub/grub.cfg
          test -s build/iso/boot/vortex-kernel.elf
          test -s build/iso/boot/vortex-kernel64.elf
          ( cd out && sha256sum -c VortexOS.iso.sha256 )
          cat build/iso/boot/grub/grub.cfg
          ls -lh out/VortexOS.iso
      - name: Verificar ISO real 64 bits en QEMU
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 110s qemu-system-x86_64             -m 4096 -cdrom out/VortexOS.iso -boot order=d -display none             -vga std -serial file:vortex-64.log -monitor none -no-reboot             -netdev user,id=n0 -device e1000,netdev=n0
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU 64 falló: $rc"; exit 1; fi
          grep -aFq 'Iniciando escritorio' vortex-64.log || {
            tail -80 vortex-64.log; echo 'FALLO: no arranco modo grafico de 64 bits'; exit 1;
          }
          echo 'Vortex 64 bits grafico: OK'
      - name: Verificar segundo modo grafico de la misma imagen (32 bits)
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^set default=0$/set default=1/' build/iso/boot/grub/grub.cfg
          grub-mkrescue -o /tmp/vortex32-check.iso build/iso >/tmp/vortex-grub32.log 2>&1 || {
            cat /tmp/vortex-grub32.log; exit 1;
          }
          set +e
          timeout --signal=TERM --kill-after=5s 95s qemu-system-x86_64             -m 1024 -cdrom /tmp/vortex32-check.iso -boot order=d -display none             -vga std -serial file:vortex-32.log -monitor none -no-reboot
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 124 ]]; then echo "QEMU 32 fallo: $rc"; exit 1; fi
          grep -aFq 'Iniciando escritorio' vortex-32.log || {
            tail -80 vortex-32.log; echo 'FALLO: no arranco modo grafico de 32 bits'; exit 1;
          }
          echo 'Vortex 32 bits grafico: OK'
      - name: Guardar la ISO unica y registros
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO-unica
          path: |
            out/VortexOS.iso
            out/VortexOS.iso.sha256
            vortex-64.log
            vortex-32.log
          if-no-files-found: error
          retention-days: 30
      - name: Publicar una unica ISO preliminar descargable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          tag="vortex-iso-$short"
          gh release create "$tag"             out/VortexOS.iso out/VortexOS.iso.sha256             --target "$GITHUB_SHA" --prerelease             --title "Vortex OS - ISO unica 32/64 grafico ($short)"             --notes "Una sola ISO con dos modos graficos del kernel propio (64 y 32 bits). Incluye Debian para el modo 64, sin LibreOffice preinstalado. Arranque de ambos modos verificado en QEMU. Audio AC97 y USB UHCI FAT32 probados en QEMU; VMware ES1371/HDA y USB XHCI no estan soportados aun. Suspender es reposo de pantalla, no ACPI S3. No incluye instalador de disco."
