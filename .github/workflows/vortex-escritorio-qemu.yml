name: vortex-escritorio-qemu
on:
  pull_request:
  workflow_dispatch:
jobs:
  escritorio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar emulador y compiladores
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils grub-pc-bin xorriso mtools cpio python3
      - name: Construir sistema real de 64 bits e imagen de arranque
        run: |
          make -C kernel64 -j2
          make -C kernel -j2
          python3 tools/mkrootfs.py --debian kng-extra.cpio
          mkdir -p g/boot/grub
          cp kernel64/kng-kernel64.elf kng-extra.cpio g/boot/
          printf 'set timeout=0\ninsmod all_video\nset gfxpayload=1024x768x32,800x600x32\nmenuentry "Vortex OS" {\n multiboot /boot/kng-kernel64.elf\n module /boot/kng-extra.cpio\n boot\n}\n' > g/boot/grub/grub.cfg
          grub-mkrescue -o g.iso g
      - name: Probar GUI mediante mouse/teclado reales emulados
        run: |
          python3 tools/ci_gui.py tools/ci/vortex-ventanas.txt -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom g.iso -boot d -vga std -display none -serial stdio -m 2G > gui.log 2>&1
          grep -q "Iniciando escritorio" gui.log
          python3 - <<'PY'
          import pathlib, hashlib
          d=pathlib.Path('capturas')
          expected=['aplicaciones','biblioteca_saber','primera_leccion','respuesta','siguiente_pregunta','pantalla_completa','minimizada','restaurada']
          files=[d/(n+'.png') for n in expected]
          for f in files:
              assert f.exists() and f.stat().st_size>5000, f'Captura ausente o vacia: {f}'
          dig=[hashlib.sha256(f.read_bytes()).hexdigest() for f in files]
          assert len(set(dig))>=5, 'La interfaz no cambio entre estados'
          print('Capturas GUI reales de QEMU:', len(files), 'estados distintos:', len(set(dig)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-escritorio
          path: |
            gui.log
            capturas/*.png
