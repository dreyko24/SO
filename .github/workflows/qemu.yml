name: arranque-qemu
# Pruebas rapidas en cada push. Las pruebas con Debian real estan en diag.yml (a mano): tools/ci/*.txt
on: [push, workflow_dispatch]
# Solo conservar las pruebas de la última revisión de cada rama.
concurrency:
  group: vortex-qemu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils grub-pc-bin xorriso mtools python3
      - name: Compilar 32 y 64 bits
        run: make -C kernel && make -C kernel64
      - name: Arranque 32 bits (texto, serie)
        run: |
          timeout 20 qemu-system-i386 -kernel kernel/vortex-kernel-text.elf -display none -serial file:boot32.log -m 256M -netdev user,id=n0 -device e1000,netdev=n0 || true
          echo "=== boot32 ==="; cat boot32.log
          grep -Fq "Vortex OS" boot32.log || { echo "FALLO: el kernel de 32 bits no mostró el banner de Vortex OS"; exit 1; }
      - name: Arranque 64 bits (texto, serie)
        run: |
          timeout 20 qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf -display none -serial file:boot64.log -m 256M -netdev user,id=n0 -device e1000,netdev=n0 || true
          echo "=== boot64 ==="; cat boot64.log
          grep -Fq "Vortex OS" boot64.log || { echo "FALLO: el kernel de 64 bits no mostró el banner de Vortex OS"; exit 1; }
      - name: Programas Linux en ring 3 (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          ( sleep 4; echo "programas"; sleep 1; echo "ejecutar /bin/hola"; sleep 3; echo "ejecutar /bin/hola-pie a b"; sleep 4; echo "ejecutar /bin/hola-static x"; sleep 4; echo "ejecutar /bin/hola-dyn y z"; sleep 6; echo "ejecutar /bin/multi-static"; sleep 10; echo "ejecutar /bin/multi-pie"; sleep 10; echo "ejecutar /bin/multi-dyn"; sleep 14; echo "procesos"; sleep 1; echo "uptime"; sleep 2 ) | timeout 100 qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M > proc64.log 2>&1 || true
          echo "=== proc64 ==="; cat proc64.log
          grep -q "termino con codigo 42" proc64.log || { echo "FALLO: programa sin libc"; exit 1; }
          echo "PRUEBA hola (sin libc): OK"
          n=$(grep -c "malloc 1 MB ok" proc64.log || true)
          echo "glibc malloc OK: $n (esperado 3)"
          test "$n" -eq 3 || { echo "FALLO: memoria en programas glibc"; exit 1; }
          grep -q "argv\[1\]=a" proc64.log || { echo "FALLO: static PIE"; exit 1; }
          echo "PRUEBA static-pie: OK"
          grep -q "argv\[1\]=x" proc64.log || { echo "FALLO: static no-PIE"; exit 1; }
          echo "PRUEBA static no-PIE: OK"
          grep -q "argv\[1\]=y" proc64.log || { echo "FALLO: ELF dinamico"; exit 1; }
          echo "PRUEBA dinamico: OK"
          n=$(grep -c "TODO OK" proc64.log || true)
          echo "multi: $n (esperado 3)"
          test "$n" -eq 3 || { echo "FALLO: variantes multi ELF"; exit 1; }
      - name: Red, senales y eventos en programas de usuario (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          python3 tools/ci_server.py 18080 18081 > servidor.log 2>&1 &
          sleep 1
          ( sleep 8; echo "red"; sleep 1; echo "ejecutar /bin/nettest 18080 18081"; sleep 75; echo "procesos"; sleep 2 ) | timeout 140 qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M -netdev user,id=n0 -device e1000,netdev=n0 > red64.log 2>&1 || true
          echo "=== red64 ==="; cat red64.log
          echo "=== servidor ==="; cat servidor.log
          grep -q "nettest resultado.*TODO OK" red64.log || { echo "FALLO: red/senales/eventos"; exit 1; }
          echo "PRUEBA red+senales+eventos: OK"
      - name: Memoria y archivos en programas de usuario (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          ( sleep 8; echo "ejecutar /bin/memtest"; sleep 60; echo "procesos"; sleep 2 ) | timeout 110 qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M > mem64.log 2>&1 || true
          echo "=== mem64 ==="; cat mem64.log
          grep -q "memtest resultado.*TODO OK" mem64.log || { echo "FALLO: memoria y archivos"; exit 1; }
          echo "PRUEBA memoria+archivos: OK"
      - name: Mucha memoria (6 GB de RAM, parte por encima de 4 GB)
        run: |
          ( sleep 8; echo "mem"; sleep 1; echo "probar-ram"; sleep 25; echo "ejecutar /bin/memtest"; sleep 60; echo "mem"; echo "procesos"; sleep 2 ) | timeout 130 qemu-system-x86_64 -kernel kernel64/vortex-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 6G > mem6g.log 2>&1 || true
          echo "=== mem6g ==="; cat mem6g.log
          grep -q "memtest resultado.*TODO OK" mem6g.log || { echo "FALLO: memoria 6 GB"; exit 1; }
          echo "PRUEBA 6 GB: OK"
          python3 - <<'PY'
          import re
          t=open('mem6g.log',errors='replace').read()
          m=re.search(r'heap (\d+) KB',t)
          kb=int(m.group(1)) if m else 0
          print('heap KB:',kb)
          if kb<=5000000: raise SystemExit('FALLO: heap 6 GB demasiado pequeno')
          print('PRUEBA heap grande: OK')
          m=re.search(r'probar-ram: .*\((\d+) MB\).*-> (\w+)',t)
          print('probar-ram:',m.groups() if m else None)
          if not m or m.group(2)!='OK' or int(m.group(1))<=4200:
              raise SystemExit('FALLO: RAM por encima de 4 GB')
          print('PRUEBA RAM por encima de 4 GB: OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs, path: "*.log" }
