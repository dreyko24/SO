name: vortex-integracion
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-multilib binutils make python3
      - name: Compilar ambos kernels
        run: |
          make -C kernel -j2
          make -C kernel64 -j2
      - name: Teclado y atajos nuevos
        run: |
          gcc -std=c11 -Wall -Wextra tools/kbdtest.c -o /tmp/vortex-kbdtest
          /tmp/vortex-kbdtest
      - name: Seguridad de argumentos de Chromium y busqueda Google
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tools/browser_launch_test.c -o /tmp/vortex-browser-test
          /tmp/vortex-browser-test
      - name: Sintaxis de scripts del navegador real y construccion Debian
        run: |
          sh -n tools/rootfs-es/usr/local/bin/vortex-chromium
          sh -n tools/rootfs-es/usr/local/bin/abrir-x
          sh -n tools/mkdebian.sh
      - name: Gestor real de ventanas, dock y pantalla completa
        run: |
          gcc -std=gnu11 -O1 -g -w -fsanitize=address,undefined -fno-omit-frame-pointer tools/window_state_test.c kernel/zip.c -o /tmp/vortex-window-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/vortex-window-test
      - name: Fecha y zona horaria America/Lima
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tools/time_test.c -o /tmp/vortex-timetest
          /tmp/vortex-timetest
      - name: Validacion de respuestas NTP, correlacion y rollover 2036
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tools/ntp_test.c -o /tmp/vortex-ntp-test
          /tmp/vortex-ntp-test
      - name: Integracion NTP en la pila de red (UDP, reloj monotono, RTC)
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra tools/ntp_stack_test.c -o /tmp/vortex-ntp-stack-test
          /tmp/vortex-ntp-stack-test
      - name: Red simulada y pila de protocolos
        run: python3 tools/nettest.py
