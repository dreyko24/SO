name: construir-iso
# Construye el ISO completo (con Debian real) y lo publica en "Releases" del repositorio para descargarlo.
# Se ejecuta a mano: GitHub > Actions > construir-iso > Run workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'kernel64/**'
      - 'tools/**'
      - '.github/workflows/iso.yml'
concurrency:
  group: vortex-iso-main
  cancel-in-progress: true
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-multilib binutils grub-pc-bin grub-efi-amd64-bin xorriso mtools python3 debootstrap debian-archive-keyring cpio gzip dosfstools fdisk
      - name: Debian real (cache)
        uses: actions/cache@v4
        with:
          path: build/debian.cpio.gz
          key: debian-${{ hashFiles('tools/mkdebian.sh', 'tools/rootfs-es/**') }}
      - name: Construir ISO
        run: KNG_DEBIAN=1 bash tools/build-iso.sh
      - name: Verificar integridad de la ISO de Vortex OS
        run: |
          test -s out/VortexOS.iso
          (cd out && sha256sum -c VortexOS.iso.sha256)
      - name: Guardar ISO con Debian como artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-con-Debian-pruebas
          path: |
            out/VortexOS.iso
            out/VortexOS.iso.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publicar en Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view iso-latest >/dev/null 2>&1 || gh release create iso-latest --title "ISO mas reciente" --notes "ISO de Vortex OS con Debian real. Se reemplaza en cada construccion." --prerelease
          gh release upload iso-latest out/VortexOS.iso out/VortexOS.iso.sha256 --clobber
          gh release edit iso-latest --notes "ISO de Vortex OS con Debian real. Construido: $(date -u +%F' '%H:%M) UTC, commit ${GITHUB_SHA::7}"
